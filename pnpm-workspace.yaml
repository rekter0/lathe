packages:
  - apps/*
  - packages/*

# pnpm 11 reads project settings from this file (not from .npmrc).
engineStrict: true
saveExact: true
preferWorkspacePackages: true
autoInstallPeers: false
strictPeerDependencies: true
resolutionMode: highest
peerDependencyRules:
  allowedVersions:
    # Tailwind 4.1's Vite plugin works with the pinned Vite 8 build, but its
    # published peer range predates Vite 8. Keep the exception package-scoped.
    "@tailwindcss/vite>vite": 8.0.16

# New releases wait one week before entering the graph. Any exception should be
# narrow, documented in the lockfile review, and removed after the window.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true

# Vite 8 already brings the stable release. Force plugin-react's exact RC edge
# to that compatible stable API so prerelease packages never enter the graph.
overrides:
  "@rolldown/pluginutils": 1.0.1

